name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную из интерфейса GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Чтение репозитория
        uses: actions/checkout@v4

      - name: Настройка Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Выдача прав на выполнение gradlew
        run: chmod +x gradlew

      - name: Сборка мода
        run: ./gradlew build

      - name: Сохранение готового .jar файла в Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Build
          path: build/libs/*.jar
